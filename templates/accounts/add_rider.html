{% extends 'base.html' %}

{% block title %}
AAROHA | Add Rider
{% endblock %}

{% block content %}

<div style="
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
">

    <!-- PAGE HEADER -->
    <div style="margin-bottom: 30px;">

        <h1 style="
            margin: 0 0 8px;
            color: #1F5D42;
            font-size: 32px;
        ">
            Add Rider
        </h1>

        <p style="
            margin: 0;
            color: #718078;
            font-size: 15px;
        ">
            Create a new delivery rider account
        </p>

    </div>


    <!-- FORM CARD -->
    <div style="
        background: #FFFFFF;
        border: 1px solid #DDE5DF;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(31, 93, 66, 0.06);
    ">

        {% if error %}

        <div style="
            background: #FDECEC;
            border: 1px solid #D9534F;
            color: #B52B27;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        ">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->
            <div style="margin-bottom: 20px;">

                <label style="
                    display: block;
                    margin-bottom: 7px;
                    font-weight: 600;
                    color: #26332D;
                ">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    value="{{ username|default:'' }}"
                    placeholder="Enter username"
                    required
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 12px 14px;
                        border: 1px solid #DDE5DF;
                        border-radius: 8px;
                        font-size: 14px;
                        outline: none;
                    "
                >

            </div>


            <!-- NAME ROW -->
            <div style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-bottom: 20px;
            ">

                <!-- FIRST NAME -->
                <div>

                    <label style="
                        display: block;
                        margin-bottom: 7px;
                        font-weight: 600;
                        color: #26332D;
                    ">
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        value="{{ first_name|default:'' }}"
                        placeholder="Enter first name"
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            padding: 12px 14px;
                            border: 1px solid #DDE5DF;
                            border-radius: 8px;
                            font-size: 14px;
                        "
                    >

                </div>


                <!-- LAST NAME -->
                <div>

                    <label style="
                        display: block;
                        margin-bottom: 7px;
                        font-weight: 600;
                        color: #26332D;
                    ">
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        value="{{ last_name|default:'' }}"
                        placeholder="Enter last name"
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            padding: 12px 14px;
                            border: 1px solid #DDE5DF;
                            border-radius: 8px;
                            font-size: 14px;
                        "
                    >

                </div>

            </div>


            <!-- EMAIL -->
            <div style="margin-bottom: 20px;">

                <label style="
                    display: block;
                    margin-bottom: 7px;
                    font-weight: 600;
                    color: #26332D;
                ">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ email|default:'' }}"
                    placeholder="Enter email address"
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 12px 14px;
                        border: 1px solid #DDE5DF;
                        border-radius: 8px;
                        font-size: 14px;
                    "
                >

            </div>


            <!-- PASSWORD -->
            <div style="margin-bottom: 30px;">

                <label style="
                    display: block;
                    margin-bottom: 7px;
                    font-weight: 600;
                    color: #26332D;
                ">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 12px 14px;
                        border: 1px solid #DDE5DF;
                        border-radius: 8px;
                        font-size: 14px;
                    "
                >

            </div>


            <!-- BUTTONS -->
            <div style="
                display: flex;
                gap: 12px;
                align-items: center;
            ">

                <button
                    type="submit"
                    style="
                        background: #1F5D42;
                        color: #FFFFFF;
                        border: none;
                        padding: 12px 22px;
                        border-radius: 8px;
                        font-size: 14px;
                        font-weight: 600;
                        cursor: pointer;
                    "
                >
                    Create Rider
                </button>


                <a
                    href="{% url 'rider_management' %}"
                    style="
                        background: #E8F3EC;
                        color: #1F5D42;
                        text-decoration: none;
                        padding: 12px 22px;
                        border-radius: 8px;
                        font-size: 14px;
                        font-weight: 600;
                    "
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
