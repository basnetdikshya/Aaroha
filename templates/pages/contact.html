{% extends 'base.html' %}

{% block title %}
Contact Us | My Store
{% endblock %}

{% block content %}

<section class="container py-5">

    <h1 class="text-center mb-4">
        Contact Us
    </h1>

    <div class="row">

        <div class="col-md-6">

            <h4>Get in Touch</h4>

            <p>
                Email: info@mystore.com
            </p>

            <p>
                Phone: +977-98XXXXXXXX
            </p>

            <p>
                Address: Nepal
            </p>

        </div>


        <div class="col-md-6">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Message
                    </label>

                    <textarea name="message"
                              class="form-control"
                              rows="5"
                              required></textarea>

                </div>


                <button type="submit"
                        class="btn btn-primary">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
